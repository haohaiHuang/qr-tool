<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR 码增强工具</title>
<script type="importmap">
{
  "imports": {
    "jsqr": "./vendor/jsqr.mjs",
    "qrcode-generator": "./vendor/qrcode-generator.mjs",
    "@zxing/library": "https://esm.sh/@zxing/library@0.21.3"
  }
}
</script>
<style>
:root {
  --paper: #f7f5ef; --surface: #fffefa; --ink: #17201f; --muted: #65706d;
  --line: #d8dcd5; --accent: #176b5d; --accent-dark: #0f5147; --accent-soft: #dcece7;
  --warning: #8a5a12; --warning-soft: #fff3d6; --danger: #a33b32; --danger-soft: #fbe9e6;
  --shadow: 0 22px 60px rgb(34 50 45 / 10%);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(circle at 10% 0%, rgb(23 107 93 / 9%), transparent 32rem),
    linear-gradient(180deg, #fbfaf6 0%, var(--paper) 32rem);
  line-height: 1.6; text-rendering: optimizeLegibility;
}
main { max-width: 860px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
h1 { font-size: 1.5rem; font-weight: 780; letter-spacing: -0.03em; }
p.sub { color: var(--muted); font-size: .9rem; margin-top: .2rem; }

#drop {
  margin-top: 1.5rem; padding: 3rem 1.5rem; border: 2px dashed var(--line);
  border-radius: 14px; text-align: center; color: var(--muted);
  background: rgb(255 255 255 / 58%);
  cursor: pointer; transition: border-color .15s, background .15s, box-shadow .15s;
}
#drop.dragover { border-color: var(--accent); background: var(--accent-soft); }
#drop strong { color: var(--ink); }

#status { margin-top: 1rem; font-size: .9rem; min-height: 1.5em; }
#status.warn { color: var(--warning); }
#status.ok { color: var(--accent); }

#result { margin-top: 1.5rem; display: none; }
#result .row { display: flex; gap: 1rem; flex-wrap: wrap; }
#result figure { flex: 1; min-width: 240px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .8rem; box-shadow: var(--shadow); }
#result figcaption { font-size: .8rem; color: var(--muted); margin-bottom: .5rem; }
#result canvas, #result svg { max-width: 100%; height: auto; display: block; border-radius: 4px; }
#result .bar { display: flex; gap: .6rem; margin-top: 1rem; flex-wrap: wrap; }
button {
  padding: .5rem 1.2rem; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); font-size: .9rem; cursor: pointer;
  transition: opacity .15s, background .15s;
}
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 8px 18px rgb(23 107 93 / 22%); }
button:hover { opacity: .9; }
button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<main>
  <h1>QR 码增强工具</h1>
  <p class="sub">低分辨率码 → 高清 PNG / SVG（标准码解码重生 · 风格保留 · 闭环自检）</p>

  <div id="drop">
    <strong>拖拽图片到此处</strong>，或点击选择文件
    <input type="file" id="file" hidden accept="image/*">
  </div>
  <div id="status"></div>

  <div id="result">
    <div class="row">
      <figure><figcaption>原图</figcaption><canvas id="src"></canvas></figure>
      <figure><figcaption>增强结果（点击对比）</figcaption><canvas id="out"></canvas></figure>
    </div>
    <div class="bar">
      <button id="dl-png" class="primary">下载 PNG</button>
      <button id="dl-svg">下载 SVG（矢量）</button>
      <div style="margin-left:auto; display:flex; align-items:center; gap:.5rem">
        <span id="switch-hint" style="cursor:pointer; position:relative; font-size:1rem; line-height:1; display:inline-flex">
          <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--warn)"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span id="switch-hint-bubble" style="display:none; position:absolute; bottom:130%; right:0; background:#333; color:#fff; padding:.6rem .8rem; border-radius:6px; font-size:.78rem; width:230px; z-index:20; box-shadow:0 2px 8px rgba(0,0,0,.2)">如增强重绘效果不理想，可点击「原图放大」切换为像素保真模式</span>
        </span>
        <button id="switch-mode">原图放大</button>
      </div>
      <p class="sub" style="margin-top:.6rem">输出为基于当前原图的最高可用分辨率；如需更清晰，请提供更高清的原图（如微信后台 1280px 官方码）。</p>
    </div>
  </div>
</main>
<script type="module">
  // 动态 import 引导（自动加载 ui.js 在某些环境下时序不稳，动态 import 更可靠）
  import("./ui.js").catch((e) => {
    const st = document.getElementById("status");
    if (st) st.textContent = "模块加载失败: " + e.message;
  });
</script>
</body>
</html>
