<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5ef">
<meta name="color-scheme" content="light">
<title>QR 工具集</title>
<style>
  :root {
    --paper: #f7f5ef; --surface: #fffefa; --ink: #17201f; --muted: #65706d;
    --line: #d8dcd5; --radius: 12px;
    --shadow: 0 10px 30px rgb(23 32 31 / .08);
  }
  * { box-sizing: border-box; }
  html {
    background: var(--paper);
    color-scheme: light;
    overflow-x: clip;
    /* 底部回弹会把地址栏顶来回，看起来像底部在抖 */
    overscroll-behavior-y: none;
  }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    /* 100vh 在手机上等于地址栏收起后的大视口，比可见区域高出一截。
       底部多出来的那截可滚动距离会和地址栏显隐互相触发，形成抖动。
       -webkit-fill-available / 100svh 取地址栏展开时的小视口。 */
    min-height: 100vh;
    min-height: -webkit-fill-available;
    min-height: 100svh;
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, #fbfaf6 0%, var(--paper) 30rem);
    -webkit-font-smoothing: antialiased;
  }
  main {
    flex: 1;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding:
      calc(1.5rem + env(safe-area-inset-top, 0px))
      calc(1.5rem + env(safe-area-inset-right, 0px))
      3rem
      calc(1.5rem + env(safe-area-inset-left, 0px));
  }
  .back-nav {
    display: flex; align-items: center; flex-wrap: wrap;
    gap: .15rem .75rem; margin: 0 0 2.2rem;
  }
  .back-link {
    display: inline-flex; align-items: center;
    color: var(--muted); text-decoration: none; line-height: 1;
    border-radius: 8px; white-space: nowrap;
    font-size: 13.5px; font-weight: 650; letter-spacing: .01em;
    padding: .45rem .15rem .45rem 0;
  }
  .back-link:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  @media (hover: hover) {
    .back-link:hover { color: var(--ink); }
  }
  header { margin-bottom: 2.6rem; }
  .eyebrow {
    margin: 0 0 .6rem; color: var(--muted); font-size: 13px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase;
  }
  h1 {
    margin: 0 0 .5rem; font-size: clamp(1.9rem, 4vw, 2.6rem); font-weight: 700;
    line-height: 1.1; letter-spacing: -.02em; text-wrap: balance; overflow-wrap: anywhere;
  }
  .sub { margin: 0; color: var(--muted); font-size: 1.02rem; text-wrap: pretty; }

  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.6rem; }

  .card {
    --block: #176b5d; --block-dark: #0f5147; --block-soft: #dcece7;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 1.4rem;
    box-shadow: var(--shadow); display: flex; flex-direction: column;
  }
  .card.deco-b { --block: #c25e7c; --block-dark: #a34a67; --block-soft: #f6e3ea; }
  .tag {
    margin: 0 0 .5rem; color: var(--block); font-size: 12.5px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase;
  }
  .card h2 {
    margin: 0 0 .45rem; font-size: 1.35rem; font-weight: 700; letter-spacing: -.01em;
    line-height: 1.2; text-wrap: balance; overflow-wrap: anywhere;
  }
  .desc { margin: 0 0 1rem; color: var(--muted); font-size: .95rem; line-height: 1.55; text-wrap: pretty; }
  .btn {
    margin-top: auto; display: inline-flex; align-items: center; justify-content: center;
    gap: .5rem; padding: .72rem 1.1rem; border-radius: 12px; text-decoration: none;
    font-weight: 650; font-size: .95rem; color: #fff;
    background: var(--block); box-shadow: 0 8px 20px var(--block-soft);
    transition: background 160ms ease, transform 160ms ease;
  }
  .btn:focus-visible { outline: 2px solid var(--block-dark); outline-offset: 2px; }
  @media (hover: hover) {
    .btn:hover { background: var(--block-dark); }
  }
  .btn:active { transform: translateY(1px); }
  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }

  .site-footer {
    padding: 0 0 calc(2rem + env(safe-area-inset-bottom, 0px));
    text-align: center; color: var(--muted); font-size: 14px;
    flex-shrink: 0;
  }
  .site-footer a {
    display: inline-flex; align-items: center; gap: .55rem;
    color: var(--muted); text-decoration: none; transition: color 160ms ease;
  }
  .site-footer a:hover { color: var(--ink); }
  .site-footer svg { width: 22px; height: 22px; fill: currentColor; flex-shrink: 0; }

  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; }
  }

  /* 内容高度落在「小视口」和「大视口」之间时，文档滚动会让地址栏收起，
     可滚动距离随即归零，地址栏又展开，底部就一直抖。
     手机上把文档锁在小视口，只让 main 滚动，地址栏不再被带着收放。 */
  @supports (height: 100svh) {
    @media (hover: none) and (pointer: coarse) {
      html, body {
        height: 100svh;
        max-height: 100svh;
        overflow: hidden;
      }
      body { min-height: 0; }
      main {
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
      }
    }
  }
</style>
</head>
<body>
<main>
  <nav class="back-nav" aria-label="页面导航">
    <a class="back-link" href="https://hhhbewater.xyz/">← 返回主页</a>
  </nav>
  <header>
    <p class="eyebrow">QR Toolkit</p>
    <h1>二维码工具集</h1>
    <p class="sub">两个工具，一个入口——按需选用。</p>
  </header>

  <div class="grid">
    <section class="card">
      <p class="tag">A · 增强</p>
      <h2>QR 码增强工具</h2>
      <p class="desc">低分辨率码 → 高清 PNG / SVG：标准码结构重绘、风格保留、闭环自检。</p>
      <a class="btn" href="./index.html">进入增强工具 →</a>
    </section>

    <section class="card deco-b">
      <p class="tag">B · 创作</p>
      <h2>3D 樱花树 QR</h2>
      <p class="desc">把二维码变成一棵可扫码的 3D 樱花树——方块即模块，形与二维码同构。</p>
      <a class="btn" href="./qr3d.html">进入樱花树 →</a>
    </section>
  </div>

</main>
<footer class="site-footer">
  <a href="https://github.com/haohaiHuang/qr-tool" target="_blank" rel="noopener" aria-label="GitHub 仓库">

</footer>
</body>
</html>
